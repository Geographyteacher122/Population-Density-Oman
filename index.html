<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a42">
<title>النمو السكاني والكثافة السكانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>:root{--paper:#fbf3dc;--parch:#f1e2b8;--ink:#4a3220;--sepia:#8a5a2b;--gold:#D8B76A;--wax:#a8322d;--wax2:#6e1f1b;--teal:#256b54;--sea:#7fc4d8;--olive:#5f7a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif}
html,body{height:100%;margin:0}
body{background:#e9d6a6 radial-gradient(120% 90% at 50% 0%,#f6e9c4,#e6d09a 70%,#d9bf86);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit}
#app{height:100dvh;display:flex;flex-direction:column}
.hud{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px;background:linear-gradient(#f9efd0,#ecd9a6);border-bottom:3px double var(--sepia);box-shadow:0 4px 14px rgba(74,50,32,.25)}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand h1{margin:0;font-size:clamp(17px,2.5vw,26px);font-weight:900;line-height:1.15;color:var(--ink)}
.brand small{display:block;font-size:clamp(12px,1.5vw,15px);font-weight:700;color:var(--sepia)}
.seal{display:grid;place-items:center;min-width:58px;padding:3px 10px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#d9594f,var(--wax) 55%,var(--wax2));color:#FFF9ED;box-shadow:0 3px 0 var(--wax2),0 5px 10px rgba(74,50,32,.35);text-align:center}
.seal b{display:block;font-size:20px;font-weight:900;line-height:1.1}.seal span{font-size:11.5px;font-weight:700;opacity:.9}
.hbtn{appearance:none;border:2px solid var(--sepia);background:var(--paper);color:var(--ink);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.main{flex:1;min-height:0;display:grid;grid-template-columns:clamp(330px,34vw,440px) minmax(0,1fr);gap:14px;padding:12px 14px 4px}
.panel{min-height:0;display:flex;flex-direction:column;gap:12px}
.prog{flex:none;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.prog i{width:20px;height:20px;border-radius:50%;border:2px solid var(--sepia);background:rgba(255,255,255,.4);position:relative}
.prog i.done{background:radial-gradient(circle at 35% 30%,#d9594f,var(--wax) 55%,var(--wax2));border-color:var(--wax2);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
.prog i.done::after{content:'★';position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#ffe9b0;font-style:normal}
.prog i.cur{background:#fff3c4;border-color:var(--gold);animation:pul 1.3s infinite}
@keyframes pul{50%{box-shadow:0 0 0 5px rgba(197,138,27,.35)}}
@keyframes stamp{from{transform:scale(2.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.qcard{position:relative;margin:14px 4px 0;background:linear-gradient(180deg,#fdf6e1,#f3e4bb);border-radius:6px;padding:22px 16px 18px;display:flex;flex-direction:column;gap:11px;box-shadow:0 12px 26px rgba(74,50,32,.35),inset 0 0 0 2px rgba(138,90,43,.35);transform-origin:top;animation:unroll .55s cubic-bezier(.2,.9,.3,1) both}
.qcard::before,.qcard::after{content:'';position:absolute;left:-10px;right:-10px;height:20px;border-radius:10px;background:linear-gradient(#8a5a2b,#e8c98c 45%,#9b6a32 75%,#6b4423);box-shadow:0 3px 6px rgba(0,0,0,.3)}
.qcard::before{top:-13px}.qcard::after{bottom:-13px}
@keyframes unroll{from{transform:scaleY(.15);opacity:0}to{transform:none;opacity:1}}
.pill{display:inline-flex;padding:3px 16px;border-radius:999px;background:var(--teal);color:#ffeab8;font-weight:800;font-size:15px;box-shadow:0 2px 0 #08404b}
.badge{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q{font-size:clamp(20px,3vh,27px);font-weight:900;line-height:1.7;color:var(--ink);padding:4px 2px}
.q b{color:var(--wax)}
.hintbox{font-size:17px;font-weight:700;color:#5a4306;background:#FFF9ED;border:1.5px dashed var(--gold);border-radius:10px;padding:6px 12px}
.btn{appearance:none;border:0;border-radius:999px;padding:11px 20px;font-weight:900;font-size:18px;cursor:pointer;color:#FFF9ED;background:radial-gradient(circle at 35% 25%,#d9594f,var(--wax) 55%,var(--wax2));box-shadow:0 4px 0 var(--wax2),0 8px 14px rgba(74,50,32,.3);transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.gold{background:linear-gradient(135deg,#f4c64d,#D8B76A);color:#3b2a05;box-shadow:0 4px 0 #8f7432,0 8px 14px rgba(74,50,32,.3)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 #b99a5e;border:1.5px solid #c9ac72}
.btn.small{padding:5px 14px;font-size:15px}
.btn:disabled{opacity:.5}
.note{font-size:14.5px;font-weight:700;color:#7d6538;text-align:center}
.stars{display:flex;justify-content:center;gap:6px}.stars svg{width:44px;height:44px}
.stars svg path{fill:#e5d8b2;stroke:#c9b27a;stroke-width:2}.stars svg.on path{fill:var(--gold);stroke:#8f7432}
.fact{font-size:clamp(17px,2.4vh,21px);font-weight:700;line-height:1.85;color:var(--ink);background:rgba(255,255,255,.55);border-radius:10px;padding:10px 14px;box-shadow:inset 0 0 0 1.5px #dcc58c}
.autonote{font-size:14px;font-weight:700;color:#8a7647;text-align:center}
.wrapS{position:relative;min-width:0;min-height:0}
.stage{position:absolute;inset:0;margin:auto;border-radius:12px;overflow:hidden;background:var(--sea);touch-action:none;box-shadow:0 0 0 4px #D8B76A,0 0 0 7px var(--sepia),0 0 0 9px #D8B76A,0 14px 34px rgba(74,50,32,.5)}
.stage::after{content:'';position:absolute;inset:7px;border:1.5px solid rgba(107,68,35,.5);border-radius:8px;pointer-events:none;z-index:3}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.drawing{cursor:crosshair}
.land{fill:#efe0b0;stroke:#a07f3f;stroke-width:.7;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.land:hover{fill:#f6e9c2}
.halo{fill:none;stroke:#d6f1f7;stroke-width:8;stroke-opacity:.5;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.lb{pointer-events:none}
.zb{position:absolute;bottom:14px;inset-inline-start:14px;z-index:4;display:flex;flex-direction:column;gap:8px}
.zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--sepia);background:var(--paper);color:var(--ink);font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #b99a5e}
.rose{position:absolute;top:12px;inset-inline-start:14px;z-index:4;width:78px;height:78px;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(74,50,32,.45))}
.rose .sp{transform-origin:50% 50%;animation:spin 90s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.rose .nd{transform-origin:50% 50%;animation:nd 6s ease-in-out infinite}@keyframes nd{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.scalebar{position:absolute;z-index:4;bottom:14px;inset-inline-end:16px;color:var(--ink);font-weight:800;font-size:12.5px;text-align:center;pointer-events:none;text-shadow:0 0 4px #fff,0 0 4px #fff}
.scalebar i{display:block;height:7px;border:2.5px solid var(--ink);border-top:0;margin:0 auto 2px}
#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);z-index:5;max-width:86%;padding:8px 20px;border-radius:999px;background:var(--paper);color:var(--ink);border:2px solid var(--sepia);font-weight:800;font-size:clamp(15px,2vh,18px);opacity:0;transition:.3s;pointer-events:none;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#fbdcd6;border-color:var(--wax)}#toast.ok{background:#e3f1d0;border-color:var(--olive)}
footer{flex:none;text-align:center;padding:2px 10px 6px;font-size:15px;font-weight:800;color:var(--sepia)}
.rng{display:inline-flex;direction:rtl;unicode-bidi:isolate;white-space:nowrap}
.sealm .pop{transform-box:fill-box;transform-origin:center;animation:stamp .55s cubic-bezier(.3,1.6,.5,1) both}
.sealm .rip{transform-box:fill-box;transform-origin:center;animation:rip 2.4s ease-out infinite}@keyframes rip{from{transform:scale(.6);opacity:.8}to{transform:scale(2.4);opacity:0}}
.far .sealm text{display:none}
/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:12px;overflow:auto}
.overlay.hidden{display:none}
#intro{background:#d9c08a;padding:0}
#intro .bgimg{position:absolute;inset:0;background-size:cover;background-position:50% 55%;animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translateX(1%)}}
#intro .glow{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,244,205,.35) 50%,transparent 65%);background-size:250% 100%;animation:sweep 9s ease-in-out infinite}
@keyframes sweep{from{background-position:130% 0}to{background-position:-30% 0}}
#intro .scrim{position:absolute;inset:0;background:radial-gradient(ellipse 52% 50% at 50% 38%,rgba(251,243,220,.55),rgba(251,243,220,0) 70%),linear-gradient(180deg,rgba(0,0,0,0) 62%,rgba(10,30,45,.55) 100%)}
.ic2{position:relative;z-index:2;width:100%;height:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:clamp(20px,9vh,90px) 18px clamp(12px,3vh,26px)}
.ic2 .lesson{display:inline-block;padding:3px 20px;border-radius:999px;border:2px solid var(--sepia);background:rgba(251,243,220,.85);color:var(--ink);font-weight:900;font-size:clamp(15px,2.6vh,21px)}
.ic2 h2{margin:12px 0 0;color:var(--ink);font-weight:900;line-height:1.2;font-size:clamp(30px,8.2vh,76px);text-shadow:0 2px 0 rgba(255,244,210,.9),0 0 22px rgba(255,244,210,.95)}
.ic2 h2 .l2{display:block;font-size:.66em;color:var(--wax2)}
.ink{display:block;clip-path:inset(0 0 0 100%);animation:inkr 1.6s .3s cubic-bezier(.3,.7,.2,1) forwards}.ink.d2{animation-delay:1.1s}
@keyframes inkr{to{clip-path:inset(0 0 0 0)}}
.ic2 .btn{margin:14px 0 6px;font-size:clamp(19px,3.2vh,26px);padding:13px 46px}
.ic2 .credit{font-weight:900;font-size:clamp(16px,2.8vh,24px);color:#FFF9ED;text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 3px #000;line-height:1.55}
.ic2 .credit .c1,.ic2 .credit .c2{display:block}.ic2 .credit .sep{display:none}
.card{width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:linear-gradient(180deg,#fdf6e1,#f1e2b8);border:4px double var(--sepia);border-radius:18px;padding:18px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.5)}
#end{background:rgba(40,25,10,.7);backdrop-filter:blur(5px)}
.card h2{margin:0 0 4px;font-size:28px;font-weight:900;color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.res div{background:#fff;border:1px solid #dcc58c;border-radius:12px;padding:6px}.res b{display:block;font-size:23px;font-weight:900;color:var(--wax)}.res span{font-size:13px;color:#6b5a38}
.nameIn{width:100%;padding:11px 14px;border-radius:12px;border:2px solid #c9ac72;font:inherit;font-weight:800;font-size:19px;text-align:center;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text;margin:6px 0 10px}
.endbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.endbtns .btn{flex:1;min-width:130px}
.credit2{margin-top:10px;font-weight:800;font-size:15px;color:var(--ink);border-top:2px dashed #c9a24a;padding-top:8px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (max-width:860px),(max-aspect-ratio:1/1){
  .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:10px 12px 4px;gap:12px}
  .wrapS{order:-1;aspect-ratio:var(--ar);width:100%}
  .q{font-size:19px}.brand small{display:none}.brand h1{font-size:16px}.seal{min-width:50px;padding:2px 8px}.seal b{font-size:17px}
  footer .sep{display:none}footer .c1,footer .c2{display:block}footer{font-size:14px}
  .rose{width:52px;height:52px;top:8px}
  .ic2 h2{font-size:clamp(28px,9vw,44px)}.ic2 .credit{font-size:clamp(15px,4.2vw,20px)}
}
@media (max-height:520px) and (min-width:700px){.q{font-size:17px}.qcard{padding:16px 12px 14px;gap:7px}footer{font-size:12px;padding:0 10px 2px;line-height:1.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.guide{flex:1 1 0;min-height:0;display:flex;align-items:flex-end;justify-content:center;position:relative;margin-top:-4px}
.guide::before{content:"";position:absolute;bottom:2px;left:50%;width:46%;height:14px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(74,50,32,.28),transparent 70%)}
.guide img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;position:relative;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(.8deg)}}
@media (max-height:520px){.guide{display:none}}
@media (max-width:860px),(max-aspect-ratio:1/1){
  .main{gap:8px}
  .panel{gap:8px;overflow-y:auto;overflow-x:hidden;padding-bottom:6px}
  .prog{gap:3px}.prog i{width:17px;height:17px;border-width:1.5px}.prog i.done::after{font-size:9px}
  .qcard{margin:12px 6px 14px;padding:14px 12px 12px;gap:7px}
  .q{font-size:clamp(17px,4.6vw,21px);line-height:1.55;padding:0}
  .note{font-size:12.5px;line-height:1.5}
  .qcard .btn.small,.badge .btn{padding:3px 12px;font-size:14px}
  .stars svg{width:34px;height:34px}
  .fact{font-size:16px;padding:8px 12px;line-height:1.7}
  footer{padding:2px 10px 8px;font-size:13px;line-height:1.35}
  .guide{min-height:0}
}
.guide{container-type:size}
@container (max-height:120px){.guide img,.guide::before{display:none}}
.land.hi{stroke-width:1}
#draw path{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ref{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:0;animation:rdraw 4s ease-in-out both}
@keyframes rdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.ref2{fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:3 9;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}
.rbtns{display:flex;gap:10px}.rbtns .btn{flex:1;padding:8px 12px;font-size:17px}
.drawing{cursor:crosshair!important}
/* ===== حركة الصفحة الرئيسية ===== */
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .tw{transform-box:fill-box;transform-origin:center;animation:twk 3s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.05;transform:scale(.5)}50%{opacity:1;transform:scale(1.25)}}
.scene .drift{animation:driftx 120s linear infinite}
@keyframes driftx{from{transform:translateX(-500px)}to{transform:translateX(1900px)}}
.scene .driftA{animation:driftxA 100s linear infinite}
@keyframes driftxA{from{transform:translateX(-500px)}to{transform:translateX(1500px)}}
.scene .fly{animation:flyx 40s linear infinite}
@keyframes flyx{from{transform:translate(-200px,30px)}to{transform:translate(1800px,-50px)}}
.scene .bob{transform-box:fill-box;transform-origin:50% 90%;animation:bob2 4.2s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(6px) rotate(1.4deg)}}
.scene .sailA{animation:sailA 70s linear infinite}
@keyframes sailA{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(420px);opacity:0}}
.scene .sailB{animation:sailB 120s linear infinite}
@keyframes sailB{from{transform:translateX(-900px)}to{transform:translateX(1900px)}}
.scene .mote{animation:moteUp 10s linear infinite;transform-box:fill-box}
@keyframes moteUp{0%{transform:translate(0,40px);opacity:0}15%{opacity:.9}100%{transform:translate(30px,-260px);opacity:0}}
.scene .sunp{transform-box:fill-box;transform-origin:center;animation:sunp 5s ease-in-out infinite}
@keyframes sunp{0%,100%{opacity:.75;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
.scene .sunc{transform-box:fill-box;transform-origin:center;animation:sunp 5s ease-in-out infinite}
.scene .rays{transform-box:view-box;transform-origin:1280px 330px;animation:spinr 80s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.ic2 .btn{animation:bpulse 2.4s ease-in-out infinite}
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ic2 .lesson{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (max-width:860px){.brand h1{font-size:14.5px;line-height:1.25}}
/* ===== ليل عُمان: نيلي وذهبي، زخارف نجمية ===== */
:root{--paper:#174B3A;--parch:#256b54;--ink:#f7edd2;--sepia:#D8B76A;--gold:#D8B76A;--gold2:#D8B76A;--wax:#D8B76A;--wax2:#8f7432;--teal:#69A88D;--sea:#cfe8da;--ar:1.4}
body{background:#0f3427 radial-gradient(90% 60% at 50% 0%,#1d5c47,#0f3427 75%);color:var(--ink)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff8 50%,transparent),radial-gradient(1.2px 1.2px at 78% 12%,#fff9 50%,transparent),radial-gradient(1.6px 1.6px at 44% 62%,#fff7 50%,transparent),radial-gradient(1.2px 1.2px at 90% 70%,#fff8 50%,transparent),radial-gradient(1.4px 1.4px at 28% 88%,#fff7 50%,transparent);background-size:340px 300px;animation:tw 5s ease-in-out infinite alternate;opacity:.7}
@keyframes tw{from{opacity:.35}to{opacity:.8}}
#app{position:relative;z-index:1}
.hud{background:linear-gradient(#174B3A,#133e30);border-bottom:2px solid var(--sepia);box-shadow:0 4px 18px rgba(0,0,0,.5)}
.brand h1{color:#FFF9ED}.brand small{color:var(--gold)}
.seal{border-radius:10px;clip-path:polygon(12% 0,88% 0,100% 28%,100% 72%,88% 100%,12% 100%,0 72%,0 28%);background:linear-gradient(160deg,#E9D18F,#b8964a);color:#174B3A;box-shadow:none;padding:4px 16px}
.hbtn{background:#174B3A;border-color:var(--sepia);color:#FFF9ED}
.prog i{border-radius:0;clip-path:polygon(50% 0,62% 28%,95% 20%,76% 50%,95% 80%,62% 72%,50% 100%,38% 72%,5% 80%,24% 50%,5% 20%,38% 28%);border:0;background:#8fb9a3;width:22px;height:22px}
.prog i.done{background:linear-gradient(160deg,#f9e08e,#b8964a);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}.prog i.done::after{display:none}
.prog i.cur{background:#f6ecc8;animation:pul2 1.2s infinite}@keyframes pul2{50%{transform:scale(1.25)}}
.qcard{margin:6px 4px 0;background:linear-gradient(170deg,#256b54,#174B3A);border-radius:18px;padding:20px 18px 16px;border:2px solid var(--sepia);box-shadow:0 0 0 5px #174B3A,0 0 0 7px rgba(216,183,106,.55),0 18px 34px rgba(0,0,0,.55);animation:rise .6s cubic-bezier(.2,.9,.3,1) both;transform-origin:center}
.qcard::before,.qcard::after{content:'';position:absolute;width:26px;height:26px;left:auto;right:auto;top:-13px;bottom:auto;border-radius:0;box-shadow:none;background:linear-gradient(160deg,#f9e08e,#b8964a);clip-path:polygon(50% 0,62% 28%,95% 20%,76% 50%,95% 80%,62% 72%,50% 100%,38% 72%,5% 80%,24% 50%,5% 20%,38% 28%)}
.qcard::before{left:16px}.qcard::after{right:16px;bottom:auto;top:-13px}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.pill{background:linear-gradient(160deg,#E9D18F,#b8964a);color:#174B3A;box-shadow:none}
.q{color:#FFF9ED}.q b{color:var(--gold);text-shadow:0 0 14px rgba(216,183,106,.45)}
.note{color:#cfe6da}.autonote{color:#cfe6da}
.hintbox{background:rgba(216,183,106,.12);color:#f3e2b0;border-color:var(--gold)}
.btn{background:linear-gradient(160deg,#E9D18F,#b8964a);color:#174B3A;box-shadow:0 4px 0 #8f7432,0 8px 14px rgba(0,0,0,.4)}
.btn.gold{background:linear-gradient(160deg,#E9D18F,#b8964a)}
.btn.ghost{background:transparent;color:#FFF9ED;border:1.5px solid var(--sepia);box-shadow:none}
.stars svg path{fill:#8fb9a3;stroke:#4a95a1}.stars svg.on path{fill:var(--gold);stroke:#8f7432;filter:drop-shadow(0 0 6px rgba(216,183,106,.7))}
.fact{background:rgba(255,255,255,.07);color:#FFF9ED;box-shadow:inset 0 0 0 1.5px rgba(216,183,106,.5)}
.stage{background:var(--sea);border-radius:18px;box-shadow:0 0 0 3px #0f3427,0 0 0 5px var(--sepia),0 0 0 9px #0f3427,0 0 26px 6px rgba(216,183,106,.35),0 20px 40px rgba(0,0,0,.6)}
.stage::after{border:1px solid rgba(216,183,106,.45);border-radius:12px}
.land{fill:#dcc58f;stroke:#9b7a35;stroke-width:.6}.land:hover{fill:#e6d19e}
.land.hi{fill:#f1d98f;stroke:#c9962c;stroke-width:1.2}
.halo{stroke:#5fb3d9;stroke-opacity:.35}
.zb button{background:#174B3A;color:#FFF9ED;border:2px solid var(--sepia);box-shadow:0 3px 0 #8f7432}
.scalebar{color:#FFF9ED;text-shadow:0 0 5px #000,0 0 5px #000}.scalebar i{border-color:#FFF9ED}
#toast{background:#174B3A;color:#FFF9ED;border-color:var(--sepia)}#toast.bad{background:#4a1f2b;border-color:#e25a6a}#toast.ok{background:#173f3a;border-color:#4ad0a8}
footer{color:var(--gold)}
.guide::before{background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%)}
#intro{background:#0f3427}
#intro .bgimg{background-position:50% 60%}
#intro .scrim{background:radial-gradient(ellipse 60% 46% at 50% 28%,rgba(10,17,48,.55),rgba(10,17,48,0) 70%),linear-gradient(180deg,rgba(0,0,0,0) 60%,rgba(4,8,26,.7) 100%)}
#intro .glow{background:linear-gradient(115deg,transparent 40%,rgba(255,236,170,.14) 50%,transparent 60%);background-size:250% 100%}
.ic2 .lesson{background:rgba(22,34,79,.75);border-color:var(--sepia);color:var(--gold)}
.ic2 h2{color:#FFF9ED;text-shadow:0 0 30px rgba(216,183,106,.55),0 3px 12px rgba(0,0,0,.8)}.ic2 h2 .l2{color:var(--gold)}
.ic2 .credit{color:#FFF9ED}
.card{background:linear-gradient(170deg,#256b54,#174B3A);border:2px solid var(--sepia);box-shadow:0 0 0 6px #0f3427,0 0 0 8px var(--sepia),0 30px 70px rgba(0,0,0,.7);color:var(--ink)}
.card h2{color:#FFF9ED}.res div{background:rgba(255,255,255,.08);border-color:rgba(216,183,106,.5)}.res b{color:var(--gold)}.res span{color:#cfe6da}
.nameIn{background:#133e30;color:#FFF9ED;border-color:var(--sepia)}.credit2{color:#FFF9ED;border-color:rgba(216,183,106,.6)}
#end{background:rgba(4,8,26,.78)}

body{background:#0f3427 radial-gradient(90% 60% at 50% 0%,#1d5c47,#0f3427 75%)}

.brand h1{color:#FFF9ED}.brand small{color:#E9DCC3}

const BOX=[0,0,MAP.W,MAP.H];
let SW=1,SH=1,ms=1;const cam={x:0,y:0,w:900},tgt={x:0,y:0,w:900};
function measure(){const r=stage.getBoundingClientRect();SW=Math.max(1,r.width);SH=Math.max(1,r.height)}
const fitW=()=>Math.max(BOX[2],BOX[3]*SW/SH),MINW=Math.max(2.5*K,BOX[2]/40);
function clampC(c){const h=c.w*SH/SW;c.x=c.w>=BOX[2]?BOX[0]+BOX[2]/2:Math.min(Math.max(c.x,BOX[0]+c.w/2),BOX[0]+BOX[2]-c.w/2);c.y=h>=BOX[3]?BOX[1]+BOX[3]/2:Math.min(Math.max(c.y,BOX[1]+h/2),BOX[1]+BOX[3]-h/2)}
function applyCam(){
  clampC(cam);const h=cam.w*SH/SW;
  svg.setAttribute('viewBox',`${(cam.x-cam.w/2).toFixed(1)} ${(cam.y-h/2).toFixed(1)} ${cam.w.toFixed(1)} ${h.toFixed(1)}`);ms=cam.w/SW;
  svg.querySelectorAll('.lb').forEach(g=>g.setAttribute('transform',`translate(${g.dataset.x} ${g.dataset.y}) scale(${ms*(g.dataset.k||1)})`));
  svg.classList.toggle('far',cam.w>CFG.farRatio*BOX[2]);scaleBar();
}
function scaleBar(){const kmPerPx=ms/K*111.2;let best=CFG.sbSteps[0];for(const k of CFG.sbSteps){if(k/kmPerPx<=120)best=k}
  $('sbi').style.width=(best/kmPerPx).toFixed(0)+'px';$('sbt').textContent=AR(best)+' كم'}
function goto(x,y,w,snap){tgt.x=x;tgt.y=y;tgt.w=Math.min(Math.max(w,MINW),fitW());clampC(tgt);if(snap){Object.assign(cam,tgt);applyCam()}}
function fit(snap){goto(BOX[0]+BOX[2]/2,BOX[1]+BOX[3]/2,fitW(),snap)}
(function loop(){const dx=tgt.x-cam.x,dy=tgt.y-cam.y,dw=tgt.w-cam.w;if(Math.abs(dx)>.05||Math.abs(dy)>.05||Math.abs(dw)>.05){cam.x+=dx*.16;cam.y+=dy*.16;cam.w+=dw*.16;applyCam()}requestAnimationFrame(loop)})();
function build(){
  let s=`<defs><linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${CFG.sea[0]}"/><stop offset="1" stop-color="${CFG.sea[1]}"/></linearGradient>${CFG.defs||''}</defs>
  <rect x="-5000" y="-5000" width="12000" height="12000" fill="url(#seaG)"/>${CFG.seaDeco?CFG.seaDeco(MAP):''}`;
  s+='<g>'+MAP.c.map(c=>`<path class="halo" d="${c.d}" fill-rule="evenodd"/>`).join('')+'</g>';
  s+='<g id="land">'+[...MAP.c.filter(c=>c.id!=='OMN'),...MAP.c.filter(c=>c.id==='OMN')].map(c=>`<path class="land${(CFG.hiLand||[]).includes(c.id)?' hi':''}" data-id="${c.id}" d="${c.d}" fill-rule="evenodd"/>`).join('')+'</g>';
  if(CFG.govs)s+='<g id="govs">'+CFG.govs.map(g=>`<path class="gov" data-gid="${g.id}" d="${g.d}" fill-rule="evenodd"/>`).join('')+'</g>';
  s+='<g id="deco">'+(CFG.deco?CFG.deco(PX,PY):'')+'</g><g id="routes"></g><g id="draw"></g><g id="marks"></g>';
  svg.innerHTML=s;
}
const mk=(html,lon,lat,k,id)=>{$('marks').insertAdjacentHTML('beforeend',`<g class="lb" ${id?`id="${id}"`:''} data-x="${PX(lon).toFixed(1)}" data-y="${PY(lat).toFixed(1)}" data-k="${k||1}">${html}</g>`);applyCam()};
function ring(lon,lat,r){mk(`<circle r="${r}" fill="${CFG.ringFill}" stroke="${CFG.ringStroke}" stroke-width="3.5" stroke-dasharray="7 6"><animate attributeName="r" values="${r*.85};${r*1.15};${r*.85}" dur="1.4s" repeatCount="indefinite"/></circle>`,lon,lat,1,'hintRing')}
/* ---------- اللمس: سحب وقرص ورسم ---------- */
const ptrs=new Map();let moved=false,lastPan=null,pz=null,drawing=false,dpts=[];
let phase='intro',locked=true;
const toMap=e=>{const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());return[p.x,p.y]};
const toLL=(x,y)=>[x/K+MAP.L0,MAP.T1-y/K];
function penShip(p){if(Q[qi]&&Q[qi].type==='shade')return;let s=$('penShip');if(!s){$('marks').insertAdjacentHTML('beforeend',`<g class="lb" id="penShip" data-x="0" data-y="0" data-k=".5"><g transform="translate(0 -4)">${CFG.shipSym}</g></g>`);s=$('penShip')}s.dataset.x=p[0].toFixed(1);s.dataset.y=p[1].toFixed(1);s.setAttribute('transform',`translate(${s.dataset.x} ${s.dataset.y}) scale(${ms*.5})`)}
svg.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1&&phase==='draw'&&!locked){drawing=true;dpts=[toMap(e)];try{svg.setPointerCapture(e.pointerId)}catch(_){}$('draw').innerHTML=`<path d="M${dpts[0][0].toFixed(1)} ${dpts[0][1].toFixed(1)}" style="stroke:${curRoute().color};${Q[qi].type==='shade'?'stroke-width:34px;':''}"/>`;penShip(dpts[0]);moved=true;return}
  if(ptrs.size===2){
    if(drawing){drawing=false;$('draw').innerHTML='';dpts=[];$('penShip')&&$('penShip').remove();$('chkBtn')&&($('chkBtn').disabled=true)}
    const [a,b]=[...ptrs.values()],r=stage.getBoundingClientRect(),mx=(a[0]+b[0])/2-r.left,my=(a[1]+b[1])/2-r.top;
    pz={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,w:cam.w,ax:cam.x-cam.w/2+mx/SW*cam.w,ay:cam.y-cam.w*SH/SW/2+my/SH*cam.w*SH/SW};moved=true;return}
  moved=false;lastPan=[e.clientX,e.clientY]});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2&&pz){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),r=stage.getBoundingClientRect(),mx=(a[0]+b[0])/2-r.left,my=(a[1]+b[1])/2-r.top;
    const nw=Math.min(Math.max(pz.w*pz.d/Math.max(d,1),MINW),fitW()),nh=nw*SH/SW;
    cam.w=nw;cam.x=pz.ax-(mx/SW-.5)*nw;cam.y=pz.ay-(my/SH-.5)*nh;Object.assign(tgt,cam);applyCam();moved=true;return}
  if(drawing){const p=toMap(e),q=dpts[dpts.length-1];if(Math.hypot(p[0]-q[0],p[1]-q[1])>1.2*ms){dpts.push(p);$('draw').firstChild.setAttribute('d','M'+dpts.map(a=>a[0].toFixed(1)+' '+a[1].toFixed(1)).join('L'));penShip(p)}return}
  if(ptrs.size>1)return;
  const dx=e.clientX-prev[0],dy=e.clientY-prev[1];
  if(!moved&&Math.hypot(e.clientX-lastPan[0],e.clientY-lastPan[1])<7)return;moved=true;
  cam.x-=dx*ms;cam.y-=dy*ms;tgt.x=cam.x;tgt.y=cam.y;tgt.w=cam.w;applyCam();
});
function drawEnd(){const ok=dpts.length>6;if(ok&&$('chkBtn'))$('chkBtn').disabled=false}
const up=e=>{if(drawing){drawing=false;ptrs.delete(e.pointerId);drawEnd();return}ptrs.delete(e.pointerId);if(ptrs.size<2)pz=null;if(ptrs.size===1)lastPan=[...ptrs.values()][0]};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);svg.addEventListener('pointerleave',e=>{if(!drawing)up(e)});
svg.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?1.15:.87;tgt.w=Math.min(Math.max(cam.w*f,MINW),fitW())},{passive:false});
$('zIn').onclick=()=>{tgt.w=Math.max(MINW,tgt.w*.7)};$('zOut').onclick=()=>{tgt.w=Math.min(fitW(),tgt.w*1.4)};$('zFit').onclick=()=>fit();

const card=$('card');let Q=[],qi=0,tries=0,hint=false,stars=0,score=0;

const curRoute=()=>Q[qi].route||{color:'#c0392b'};
function toast(m,k='',t=2400){const e=$('toast');e.className='show '+k;e.textContent=m;clearTimeout(toast.h);toast.h=setTimeout(()=>e.className='',t)}
function hud(){$('sStars').textContent=AR(stars);$('sScore').textContent=AR(score);$('prog').innerHTML=Q.map((q,i)=>`<i class="${i<qi?'done':i===qi?'cur':''}"></i>`).join('')}
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
const starRow=n=>`<div class="stars">${[0,1,2].map(i=>STAR.replace('<svg','<svg class="'+(i<n?'on':'')+'"')).join('')}</div>`;
function clearTemp(){$('penShip')&&$('penShip').remove();$('hintRing')&&$('hintRing').remove();$('draw').innerHTML='';dpts=[];drawing=false;svg.classList.remove('drawing')}

  replay();stopDemo();if(q.type==='shade')setTimeout(()=>{if(Q[qi]===q&&!locked)startDemo()},350);
  if(isR){svg.classList.add('drawing');$('chkBtn').onclick=checkRoute;$('clrBtn').onclick=()=>{$('draw').innerHTML='';dpts=[];$('penShip')&&$('penShip').remove();$('chkBtn').disabled=true}}
  $('hintBtn').onclick=()=>{if(locked||hint)return;hint=true;sfx.click();$('hintBtn').disabled=true;

    else{$('hintArea').innerHTML='<div class="hintbox">💡 ابحث داخل الدائرة على الخريطة.</div>';ring(q.c[0],q.c[1],q.hr||50)}};
}

let demoRAF=0,demoT=0;
function stopDemo(){cancelAnimationFrame(demoRAF);clearTimeout(demoT);['demo','demoHand','demoCap'].forEach(i=>{const e=document.getElementById(i);e&&e.remove()});const g=svg.querySelector('.gov[data-gid="dak"]');g&&g.classList.remove('demoOn');if(phase==='demo')phase='draw'}
function startDemo(){
  const el=svg.querySelector('.gov[data-gid="dak"]');if(!el)return;
  const st=document.querySelector('.stage');phase='demo';
  const inside=(x,y)=>el.isPointInFill(new DOMPoint(x,y));
  const bb=el.getBBox(),rows=7,pts=[];
  for(let r=0;r<rows;r++){const y=bb.y+bb.height*(.14+.72*r/(rows-1));let lo=null,hi=null;
    for(let k=0;k<=80;k++){const x=bb.x+bb.width*k/80;if(inside(x,y)){if(lo===null)lo=x;hi=x}}
    if(lo===null)continue;const m=(hi-lo)*.14;lo+=m;hi-=m;
    if(r%2)pts.push([hi,y],[lo,y]);else pts.push([lo,y],[hi,y])}
  const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.id='demo';
  g.innerHTML='<path d="'+d+'"/>';$('draw').parentNode.insertBefore(g,$('draw'));

  const hand=document.createElement('div');hand.id='demoHand';
  hand.innerHTML='<svg viewBox="0 0 64 64" width="58" height="58"><circle class="rp" cx="22" cy="14" r="9"/><g><path d="M18 12c0-3 2-5 4-5s4 2 4 5v18l3-1c2-1 4 0 4 2l1 0c1-1 4-1 5 1 2-1 4 0 5 2 2 0 3 2 3 4l-1 12c-1 6-5 10-11 10H30c-5 0-8-3-10-7L12 38c-1-2 0-4 2-4s3 1 4 3V12z" fill="#FFF9ED" stroke="#174B3A" stroke-width="2.4" stroke-linejoin="round"/></g></svg>';
  const cap=document.createElement('div');cap.id='demoCap';cap.innerHTML='<b>مثال توضيحي</b> كيف نظلّل محافظة الداخلية <button type="button">تخطّي</button>';
  st.appendChild(hand);st.appendChild(cap);cap.querySelector('button').onclick=stopDemo;
  const T0=performance.now()+500,DUR=4200;
  (function tick(now){
    let t=Math.min(1,Math.max(0,(now-T0)/DUR));const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    path.style.strokeDashoffset=len*(1-e);
    const p=path.getPointAtLength(len*e),m=path.getScreenCTM(),sr=st.getBoundingClientRect();
    hand.style.transform='translate('+(p.x*m.a+p.y*m.c+m.e-sr.left-20)+'px,'+(p.y*m.d+p.x*m.b+m.f-sr.top-14)+'px)';
    hand.style.opacity=now<T0?0:1;

      el.classList.add('demoOn');hand.style.opacity=0;cap.innerHTML='<b>أحسنت!</b> هكذا يكون التظليل، والآن جرّب أنت ✔';
      demoT=setTimeout(stopDemo,2300)}
  })(performance.now());
}
function wrong(msg){tries++;sfx.bad();toast(msg,'bad');if(navigator.vibrate)navigator.vibrate(60)}
svg.addEventListener('click',e=>{
  if(moved||locked||phase!=='ask')return;const q=Q[qi];
  if(q.type==='gov'){const gid=e.target.dataset&&e.target.dataset.gid;
    if(gid===q.gid)return correct(q,()=>{const el=svg.querySelector('.gov[data-gid="'+q.gid+'"]');el&&el.classList.add('on');mk(CFG.mark(q.n,true),q.c[0],q.c[1],1,'m'+qi)});
    wrong(gid?'ليست هذه المحافظة، جرّب مرة أخرى':'اضغط داخل حدود سلطنة عُمان');return}
  const [mx,my]=toMap(e),[lo,la]=toLL(mx,my);
  const d=Math.hypot(lo-q.c[0],la-q.c[1]),tol=Math.max(q.tol,CFG.minPx*ms/K);
  let nearer=false;for(const o of Q){if(o!==q&&o.c&&o.type!=='gov'&&Math.hypot(lo-o.c[0],la-o.c[1])<d)nearer=true}
  if(d<=tol&&!nearer)return correct(q,()=>mk(CFG.mark(q.n,true),q.c[0],q.c[1],1,'m'+qi));
  wrong(d<tol*2.6?'اقتربت! حاول مرة أخرى بدقة أكبر':'ليس هذا هو الموقع، جرّب مرة أخرى');
});
/* ---------- تقييم المسار ---------- */
function refSamples(R){const out=[];for(let i=0;i<R.length-1;i++){const a=R[i],b=R[i+1],n=Math.max(1,Math.ceil(dist(a,b)/.4));for(let t=0;t<n;t++)out.push([a[0]+(b[0]-a[0])*t/n,a[1]+(b[1]-a[1])*t/n])}out.push(R[R.length-1]);return out}
function judgeRoute(pts,r){
  const D=[];for(let i=0;i<pts.length;i++){D.push(pts[i]);if(i<pts.length-1){const a=pts[i],b=pts[i+1],n=Math.ceil(dist(a,b)/.3);for(let t=1;t<n;t++)D.push([a[0]+(b[0]-a[0])*t/n,a[1]+(b[1]-a[1])*t/n])}}
  const st=r.ref[0],en=r.end;
  if(dist(D[0],st)>(r.stTol||5)&&dist(D[D.length-1],st)>(r.stTol||5))return{ok:false,msg:'ابدأ الرسم من سواحل عُمان'};
  if(dist(D[0],st)>(r.stTol||5))D.reverse();
  if(dist(D[D.length-1],en)>(r.enTol||7))return{ok:false,msg:r.endMsg};
  const R=refSamples(r.ref),TOL=r.tol;
  const near=(p,A)=>{let m=1e9;for(const a of A){const d=Math.hypot(p[0]-a[0],p[1]-a[1]);if(d<m)m=d}return m};
  const cov=R.filter(x=>near(x,D)<=TOL).length/R.length;
  const sub=D.filter((p,i)=>i%3===0);const prec=sub.filter(p=>near(p,R)<=TOL*1.25).length/sub.length;
  if(cov<.72||prec<.72)return{ok:false,msg:cov<.72?r.covMsg:'المسار يبتعد عن الطريق الصحيح، حاول مرة أخرى',cov,prec};
  return{ok:true,cov,prec}}

function checkShade(q){
  const el=svg.querySelector('.gov[data-gid="'+q.gid+'"]');
  const inside=p=>el.isPointInFill(new DOMPoint(p[0],p[1]));
  const D=[];for(let i=0;i<dpts.length;i++){D.push(dpts[i]);if(i<dpts.length-1){const a=dpts[i],b=dpts[i+1],n=Math.ceil(dist(a,b)/(6*ms));for(let t=1;t<n;t++)D.push([a[0]+(b[0]-a[0])*t/n,a[1]+(b[1]-a[1])*t/n])}}
  const ins=D.filter(inside).length/D.length;
  if(ins<.8){wrong('ظلّل داخل حدود المحافظة المطلوبة فقط');return}
  const bb=el.getBBox(),R=17*ms;let tot=0,cov=0;
  for(let x=bb.x;x<bb.x+bb.width;x+=bb.width/36)for(let y=bb.y;y<bb.y+bb.height;y+=bb.height/36){if(!inside([x,y]))continue;tot++;for(let k=0;k<D.length;k+=2){if(Math.hypot(D[k][0]-x,D[k][1]-y)<=R){cov++;break}}}
  if(!tot||cov/tot<.3){wrong('ظلّل مساحة أكبر من المحافظة بإصبعك');return}
  svg.classList.remove('drawing');$('draw').innerHTML='';
  correct(q,()=>{el.classList.add('on');el.style.fill='rgba(231,138,96,.6)';mk(CFG.mark(q.n,true),q.c[0],q.c[1],1,'m'+qi)});
}
function checkRoute(){
  if(locked||phase!=='draw')return;const q=Q[qi];if(q.type==='shade')return checkShade(q);
  const r=judgeRoute(dpts.map(p=>toLL(p[0],p[1])),q.route);
  if(!r.ok){wrong(r.msg);return}
  svg.classList.remove('drawing');$('draw').innerHTML='';$('penShip')&&$('penShip').remove();
  correct(q,()=>showRef(q),5200);
}
function showRef(q){
  const d='M'+q.route.ref.map(p=>PX(p[0]).toFixed(1)+' '+PY(p[1]).toFixed(1)).join('L'),c=q.route.color;
  $('routes').insertAdjacentHTML('beforeend',`<path class="ref" pathLength="1" d="${d}" style="stroke:${c}"/><path class="ref2" d="${d}"/>`);
  $('marks').insertAdjacentHTML('beforeend',`<g id="shipM${qi}"><animateMotion dur="4s" fill="freeze" calcMode="linear" path="${d}"/><g class="lb" data-x="0" data-y="0" data-k=".55"><g transform="translate(0 -4)">${CFG.shipSym}</g></g></g>`);applyCam();
  const e=q.route.end;mk(CFG.mark(q.route.endName||'',false),e[0],e[1],.8,'m'+qi);
}
async function correct(q,after,wait){
  locked=true;phase='fact';
  const n=Math.max(1,3-tries-(hint?1:0));stars+=n;score+=n*100;sfx.ok();toast('أحسنت! إجابة صحيحة 🎉','ok');
  clearTemp();after&&after();hud();confettiBurst(innerWidth/2,innerHeight/3,36);
  card.innerHTML=`<div class="badge"><span class="pill">${q.p} (${AR(qi+1)}/${AR(Q.length)})</span></div>${starRow(n)}
  <div style="text-align:center;font-weight:900;color:var(--gold2);font-size:16px">+${AR(n*100)} نقطة</div>
  <div class="fact">${q.f}</div><div class="autonote">ننتقل للسؤال التالي تلقائيًا…</div>`;replay();
  await sleep(wait||2800);qi++;showQ();
}
function finish(){phase='end';locked=true;clearTemp();fit();hud();sfx.fan();setTimeout(()=>{confettiBurst(innerWidth/2,innerHeight/3,140);showEnd()},1500)}

function showEnd(){
